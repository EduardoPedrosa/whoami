name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - packages/shared/**
      - deploy/Dockerfile.caprover
      - .dockerignore
      - package.json
      - yarn.lock
      - tsconfig.base.json
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/eduardopedrosa/whoami-api
    steps:
      - name: Log in to GHCR with the repository token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build, test and publish the backend image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          file: deploy/Dockerfile.caprover
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=whoami-backend
          cache-to: type=gha,mode=max,scope=whoami-backend
      - name: Deploy the immutable image to CapRover
        env:
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$CAPROVER_APP_TOKEN"
          npx --yes caprover@2.4.4 deploy \
            --caproverUrl https://captain.eplabs.com.br \
            --caproverApp whoami-api \
            --appToken "$CAPROVER_APP_TOKEN" \
            --imageName "$IMAGE@$IMAGE_DIGEST"
      - name: Check public API health
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 3 --retry-all-errors --max-time 10 \
            https://whoami-api.eplabs.com.br/api/health
